<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="formulario-container">
        <h2>Cadastrar Produto</h2>
        <form id="formulario">
            <input type="text" id="nome" placeholder="Nome do produto" required>
            <input type="number" id="preco" placeholder="Preço (ex: 29.90)" step="0.01" required>
            <input type="text" id="descricao" placeholder="Descrição" required>
            <button type="submit">Salvar</button>
        </form>
    </div>

    <div class="busca-container">
        <h2>Buscar Produto por ID</h2>
        <div class="busca-form">
            <input type="number" id="busca-id" placeholder="Digite o ID do produto" min="1">
            <div class="botoes-busca">
                <button type="button" id="btn-buscar">Buscar</button>
                <button type="button" id="btn-listar">Listar Todos</button>
            </div>
        </div>
    </div>

    <div class="lista-container">
        <h2>Lista de Produtos</h2>
        <!-- É aqui dentro que o JavaScript vai jogar os produtos -->
        <div id="lista-produtos"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
